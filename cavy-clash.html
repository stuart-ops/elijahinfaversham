const OFF=document.createElement('canvas');OFF.width=360;OFF.height=300;const offG=OFF.getContext('2d');

const LOW=document.createElement('canvas');LOW.width=480;LOW.height=270;const lowG=LOW.getContext('2d');const mainG=cv.getContext('2d');mainG.imageSmoothingEnabled=false;

function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.style.imageRendering='pixelated';}

/* ---------------- audio (all synthesised) ---------------- */
let AC=null,muted=store.get('cavy_muted',false);
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f1,f2,dur,type='sine',vol=.14,delay=0){if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),gn=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+dur+.03);}
function noise(dur,vol=.1,delay=0){if(muted)return;const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),gn=a.createGain();s.buffer=b;gn.gain.value=vol;s.connect(gn);gn.connect(a.destination);s.start(a.currentTime+delay);}
const SFX={

  kick:()=>{tone(300,120,.12,'triangle',.12);},

/* ---------------- input ---------------- */
const keys={},touch={};
const KM1={l:'KeyA',r:'KeyD',u:'KeyW',b:'KeyS',p:'KeyF',k:'KeyG',s:'KeyH'};

function readKeys(map,useTouch){const o={};for(const a in map)o[a]=!!keys[map[a]]||(!!useTouch&&!!touch[a]);return o;}
function orInp(a,b){const o={};for(const k in a)o[k]=a[k]||b[k];return o;}

const ctlP2=()=>readKeys(KM2,false);

/* ---------------- tiny UI toolkit ---------------- */
const ui={btns:[],sel:0,cols:1};
let scene=null,G=null,paused=false,R=null,frameT=0;
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
const FONT='"Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif';
function txt(s,x,y,size,fill='#fff',align='center',stroke='#3a2630',lw){g.font=`bold ${size}px ${FONT}`;g.textAlign=align;g.textBaseline='middle';g.lineJoin='round';
  if(stroke){g.lineWidth=lw||Math.max(3,size/6);g.strokeStyle=stroke;g.strokeText(s,x,y);}g.fillStyle=fill;g.fillText(s,x,y);}
function starPath(x,y,r,rot){g.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,q=i%2?r*.45:r;g.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}g.closePath();}
function button(label,x,y,w,h,fn,o={}){
  const i=ui.btns.length;ui.btns.push({x,y,w,h,fn,o});
  if(o.invisible)return;
  const sel=ui.sel===i;
  g.save();g.translate(x+w/2,y+h/2);if(sel)g.scale(1.05+Math.sin(frameT*.2)*.012,1.05+Math.sin(frameT*.2)*.012);g.translate(-w/2,-h/2);
  g.fillStyle='rgba(0,0,0,.25)';rr(3,6,w,h,h/2.4);g.fill();
  g.fillStyle=sel?'#ffd23f':(o.col||'#ffffff');g.strokeStyle='#3a2630';g.lineWidth=4;rr(0,0,w,h,h/2.4);g.fill();g.stroke();
  g.restore();
  txt(label,x+w/2,y+h/2+1,o.size||Math.min(30,h*.52),'#3a2630','center',null);
}
function go(name,p){scene=SCENES[name];scene.name=name;ui.sel=0;ui.cols=scene.cols||1;ui.btns=[];paused=false;
  document.body.classList.toggle('fighting',name==='fight');scene.enter&&scene.enter(p);}

  for(let i=ui.btns.length-1;i>=0;i--){const b=ui.btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){ui.sel=i;activate(i);return;}}
  scene&&scene.tap&&scene.tap();});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const[x,y]=canvasXY(e);
  for(let i=ui.btns.length-1;i>=0;i--){const b=ui.btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){ui.sel=i;return;}}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
const GAMEKEYS=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','Semicolon','Enter']);
addEventListener('keydown',e=>{
  if(GAMEKEYS.has(e.code))e.preventDefault();
  if(e.repeat)return;
  keys[e.code]=true;ac();
  const inFight=scene&&scene.name==='fight';
  if(inFight&&!paused){if(e.code==='Escape'||e.code==='KeyP')pauseGame(true);return;}
  if(paused&&(e.code==='Escape'||e.code==='KeyP')){pauseGame(false);return;}
  const n=ui.btns.length;if(!n)return;
  const c=e.code;
  if(c==='ArrowLeft'||c==='KeyA')ui.sel=Math.max(0,ui.sel-1);
  else if(c==='ArrowRight'||c==='KeyD')ui.sel=Math.min(n-1,ui.sel+1);
  else if(c==='ArrowUp'||c==='KeyW'){ui.sel=ui.cols>1?(ui.sel-ui.cols>=0?ui.sel-ui.cols:ui.sel):Math.max(0,ui.sel-1);}
  else if(c==='ArrowDown'||c==='KeyS'){ui.sel=ui.cols>1?(ui.sel+ui.cols<n?ui.sel+ui.cols:ui.sel):Math.min(n-1,ui.sel+1);}
  else if(c==='Enter'||c==='Space'||c==='KeyF'){activate(ui.sel);}
  else if(c==='Escape'){scene.back&&scene.back();}
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;for(const k in touch)touch[k]=false;if(scene&&scene.name==='fight'&&!paused)pauseGame(true);});

function drawPigVec(ch,p){
  const pose=p.pose||'idle',t=p.t||0,ext=p.ext||0,sc=p.scale||1;
  let sx=1,sy=1,rot=0,piv=-30,ox=0,oy=0,bob=0,gx=36,gy=-62,g2x=22,g2y=-52,fx=15,fy=-6,bx=-14,by=-5,eye='open',mouth='smile';const lv=clamp(p.lv||0,-9,9);
  switch(pose){
   case 'idle':{const s=Math.sin(t*.12);bob=s*1.2;sy=1+s*.025;sx=1-s*.012;gy=-62+s*2;g2y=-52-s*2;rot=Math.sin(t*.05)*.025;fx=15+Math.sin(t*.05)*2;break;}
   case 'walk':{const w=Math.sin(t*.28),c=Math.cos(t*.28);bob=-Math.abs(w)*5;rot=.09;fx=15+w*10;fy=-6-Math.max(0,c)*7;bx=-14-w*10;by=-5-Math.max(0,-c)*7;gy=-62+w*3;g2y=-52-w*3;sx=1+Math.abs(w)*.02;sy=1-Math.abs(w)*.02;break;}
   case 'air':sx=.93;sy=1.1;fy=-12;gx=42;gy=-72;break;
   case 'punch':gx=36+54*ext;gy=-64;g2x=12;g2y=-56;rot=.1*ext;mouth='open';break;
   case 'kick':fx=15+64*ext;fy=-8-38*ext;rot=-.15*ext;gx=26;gy=-78;g2x=14;g2y=-66;mouth='open';break;
   case 'block':gx=34;gy=-86;g2x=42;g2y=-70;eye='squint';sy=.95;mouth='flat';break;
   case 'hit':rot=-.3;eye='ouch';mouth='o';gx=8;gy=-54;g2x=2;g2y=-46;ox=-4;break;
   case 'ko':{const k=Math.min(1,t/14);rot=-1.3*(1-Math.pow(1-k,2))+(k>=1?Math.sin(t*.15)*.03:0);}piv=0;eye='swirl';mouth='tongue';gx=14;gy=-40;g2x=4;g2y=-30;oy=-14;break;
   case 'win':eye='happy';mouth='open';gx=30;gy=-126;g2x=-4;g2y=-122;break;
   case 'cast':sy=1-.1*(1-ext);gx=36+52*ext;gy=-70;g2x=30+44*ext;g2y=-58;mouth='open';rot=.08*ext;break;
   case 'crouch':sy=.8;sx=1.15;gx=30;gy=-44;g2x=20;g2y=-38;eye='squint';break;
   case 'pounce':sx=.95;sy=1.08;gx=52;gy=-66;g2x=46;g2y=-54;fx=22;fy=-18;mouth='open';break;
   case 'spin':rot=p.rot||0;piv=-44;gx=22;gy=-52;g2x=14;g2y=-40;eye='happy';mouth='open';fx=8;fy=-14;break;
   case 'cheer':eye='happy';mouth='open';bob=-Math.abs(Math.sin(t*.15))*10;gx=26;gy=-118;g2x=-2;g2y=-114;break;
  }
  g.save();g.translate(p.x+ox,p.y+oy+bob);g.scale(p.face*sc,sc);g.scale(sx,sy);g.translate(0,piv);g.rotate(rot);g.translate(0,-piv);
  g.lineWidth=3;g.strokeStyle=OUT;g.lineJoin='round';g.lineCap='round';
  const glove=ch.glove||'#e53935';
  if(p.aura){const gr=g.createRadialGradient(0,-50,10,0,-50,78+Math.sin(t*.25)*6);gr.addColorStop(0,'rgba(255,230,100,.55)');gr.addColorStop(1,'rgba(255,200,40,0)');g.fillStyle=gr;g.fillRect(-100,-140,200,200);}
  if(ch.acc==='king'){g.fillStyle='#b71c1c';g.beginPath();g.moveTo(-8,-74);g.quadraticCurveTo(-52,-60+Math.sin(t*.2)*4,-56+Math.sin(t*.2)*5,-12);g.lineTo(-18,-14);g.closePath();g.fill();g.stroke();}
  // far ear + far arm
  el(-8,-102,10,14,ch.body,-.3-lv*.045);el(-8,-102,5,8,PINK,-.3-lv*.045,false);
  arm(ch,10,-54,g2x-4,g2y,glove,true);
  // feet
  el(bx,by,13,7,PINK);el(fx,fy,13,7,PINK);
  // body
  el(0,-42,34,40,ch.body);
  g.save();g.beginPath();g.ellipse(0,-42,34,40,0,0,TAU);g.clip();if(ch.belly){el(12,-34,22,30,ch.belly,0,false);}patternPaint(ch,'body');g.restore();
  el(0,-42,34,40,null);
  // head
  el(18,-80,30,25,ch.body);
  g.save();g.beginPath();g.ellipse(18,-80,30,25,0,0,TAU);g.clip();patternPaint(ch,'head');g.restore();
  el(18,-80,30,25,null);
  // ear
  el(0,-98,11,15,ch.body,-.2-lv*.045);el(0,-98,5.5,9,PINK,-.2-lv*.045,false);
  // cheek blush
  g.fillStyle='rgba(255,110,140,.45)';g.beginPath();g.ellipse(28,-70,7,5,0,0,TAU);g.fill();
  // eye
  const ex=31,ey=-84,ec=ch.eye||'#1a1a1a';
  if(eye==='open'){el(ex,ey,5.5,7,ec,0,false);if(ch.eye){el(ex,ey,2.6,3.6,'#220',0,false);}g.fillStyle='#fff';g.beginPath();g.arc(ex+1.8,ey-2.6,2,0,TAU);g.fill();}
  else if(eye==='squint'){g.beginPath();g.moveTo(ex-6,ey);g.lineTo(ex+5,ey);g.stroke();}
  else if(eye==='happy'){g.beginPath();g.arc(ex,ey+3,6,Math.PI*1.1,Math.PI*1.9);g.stroke();}
  else if(eye==='ouch'){g.beginPath();g.moveTo(ex-6,ey-6);g.lineTo(ex+4,ey);g.lineTo(ex-6,ey+6);g.stroke();}
  else if(eye==='swirl'){g.beginPath();for(let a=0;a<12;a+=.5){const r=a*.7;g.lineTo(ex+Math.cos(a+t*.2)*r,ey+Math.sin(a+t*.2)*r);}g.stroke();}
  // nose, whiskers, mouth
  el(47,-77,6,5,'#f48fb1');
  g.lineWidth=1.6;g.strokeStyle='rgba(40,25,30,.65)';g.beginPath();g.moveTo(46,-74);g.lineTo(66,-81);g.moveTo(46,-73);g.lineTo(68,-73);g.moveTo(46,-71);g.lineTo(65,-65);g.stroke();
  g.lineWidth=3;g.strokeStyle=OUT;
  if(mouth==='smile'){g.beginPath();g.arc(40,-72,6,.25,Math.PI-.5);g.stroke();g.fillStyle='#fff';g.fillRect(41,-67,3.6,5);g.strokeRect(41,-67,3.6,5);}
  else if(mouth==='open'){el(41,-66,6,6,'#8a2a40');el(41,-63,4,3,'#ff8fa3',0,false);}
  else if(mouth==='o'){el(41,-66,3.5,4.5,'#8a2a40');}
  else if(mouth==='tongue'){g.beginPath();g.moveTo(34,-68);g.lineTo(46,-68);g.stroke();el(42,-64,3.6,5,'#ff7a95');}
  else{g.beginPath();g.moveTo(35,-68);g.lineTo(46,-68);g.stroke();}
  drawAcc(ch,p,t);
  arm(ch,14,-54,gx,gy,glove,false);
  g.restore();
}

const SPRITES_ON=true,sprImg={},sprLeft={};
(function(){for(const cid in SPR_DATA){sprImg[cid]={};const ks=Object.keys(SPR_DATA[cid]);sprLeft[cid]=ks.length;
  ks.forEach(k=>{const im=new Image();im.onload=()=>{sprImg[cid][k]={c:im,ax:SPR_DATA[cid][k].ax,w:SPR_DATA[cid][k].w,h:SPR_DATA[cid][k].h};sprLeft[cid]--;};im.src=SPR_DATA[cid][k].d;});}})();
function sprFor(ch,k){return(sprLeft[ch.id]===0&&sprImg[ch.id])?sprImg[ch.id][k]||null:null;}
function sprIsReady(ch){return sprLeft[ch.id]===0;}
function drawPigSprite(ch,p){
  const pose=p.pose||'idle',t=p.t||0,ext=p.ext||0,sc=p.scale||1;
  let k='idle',rot=0,sx=1,sy=1,bob=0,flip=false,piv=0;
  switch(pose){
   case 'idle':{const s=Math.sin(t*.12);bob=s*1.2;sy=1+s*.02;sx=1-s*.01;break;}
   case 'walk':{k=['walk_a','idle','walk_b','idle'][Math.floor(t/6)%4];bob=-Math.abs(Math.sin(t*.26))*3;break;}
   case 'air':case 'pounce':k='air';sy=1.02;break;
   case 'punch':k=ext>=.25?'punch':'idle';if(ext<0)rot=ext*.3;break;
   case 'kick':k=ext>=.25?'kick':'idle';if(ext<0)rot=ext*.3;break;
   case 'block':k='block';break;
   case 'hit':k='hit';break;
   case 'ko':k='ko';flip=true;break;
   case 'cheer':case 'win':k=Math.floor(t/12)%2?'cheer':'idle';if(k==='idle')bob=-4;bob+=-Math.abs(Math.sin(t*.15))*5;break;
   case 'cast':k=ext>=.3?'cast':'idle';break;
   case 'crouch':k='crouch';break;
   case 'spin':k='spin';rot=p.rot||0;piv=.5;break;
  }
  const S=sprFor(ch,k);if(!S){drawPigVec(ch,p);return;}
  g.save();g.translate(Math.round(p.x/2)*2,Math.round((p.y+(bob||0))/2)*2);g.scale(p.face*sc*(flip?-1:1),sc);
  if(p.aura){const gr=g.createRadialGradient(0,-50,10,0,-50,80+Math.sin(t*.25)*6);gr.addColorStop(0,'rgba(255,230,100,.55)');gr.addColorStop(1,'rgba(255,200,40,0)');g.fillStyle=gr;g.fillRect(-100,-140,200,200);}
  g.scale(2*sx,2*sy);
  if(piv){g.translate(0,-S.h*piv);g.rotate(rot);g.translate(0,S.h*piv);}else if(rot)g.rotate(rot);
  g.imageSmoothingEnabled=false;g.drawImage(S.c,-S.ax,-S.h);g.restore();
}
function drawPig(ch,p){if(SPRITES_ON&&sprIsReady(ch))drawPigSprite(ch,p);else drawPigVec(ch,p);}
function arm(ch,sx0,sy0,x,y,glove,far){
  g.lineCap='round';g.strokeStyle=OUT;g.lineWidth=13;g.beginPath();g.moveTo(sx0,sy0);g.lineTo(x-6,y);g.stroke();
  g.strokeStyle=ch.body;g.lineWidth=8;g.beginPath();g.moveTo(sx0,sy0);g.lineTo(x-6,y);g.stroke();
  g.lineWidth=3;g.strokeStyle=OUT;el(x,y,12.5,11.5,far?shade(glove):glove);g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(x+2,y-4,5,3,-.3,0,TAU);g.fill();
  el(x-10,y+1,4,8,'#fff',0.1);
}
function shade(c){const n=parseInt(c.slice(1),16),r=(n>>16)*.8|0,gg=((n>>8)&255)*.8|0,b=(n&255)*.8|0;return`rgb(${r},${gg},${b})`;}
function drawShadow(x,y,h){const s=clamp(1-(GROUND-y)/260,.35,1);g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(x,GROUND+4,40*s,9*s,0,0,TAU);g.fill();}

function newFighter(ch,side,ctl,o={}){
  return{ch,side,ctl,name:ch.name,x:side?700:260,y:GROUND,vx:0,vy:0,face:side?-1:1,onGround:true,maxhp:o.hp||100,hp:o.hp||100,state:'free',act:null,stun:0,meter:0,
    blocking:false,entering:false,trail:[],combo:0,comboT:0,prev:{},spd:(ch.spd||1)*(o.spd||1),pow:(ch.pow||1)*(o.pow||1),wins:0,anim:0,flash:0,kot:0,ai:{cool:40,l:false,r:false,b:false},label:o.label||''};
}
function resetFighter(f){f.x=f.side?700:260;f.y=GROUND;f.vx=f.vy=0;f.face=f.side?-1:1;f.onGround=true;f.hp=f.maxhp;f.trail=[];f.state='free';f.act=null;f.stun=0;f.meter=0;f.blocking=false;f.kot=0;f.prev={};f.ai.cool=40;f.ai.l=f.ai.r=f.ai.b=false;}
function hitsHurt(hb,o){return hb.x1>o.x-26&&hb.x0<o.x+26&&hb.y1>o.y-96&&hb.y0<o.y;}
function addFx(o){G.fx.push(Object.assign({life:30,max:30,vx:0,vy:0,rot:0,vr:0,g:0},o));}
function burst(x,y,n,cols,big){for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(2,big?10:7);addFx({k:'star',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,g:.18,life:rnd(18,34)|0,max:34,size:rnd(big?9:6,big?18:12),col:pick(cols),vr:rnd(-.3,.3)});}}

/* ---------------- AI ---------------- */
function aiCtl(L){return function(f,o){
  const a=f.ai,inp={l:false,r:false,u:false,b:false,p:false,k:false,s:false};
  if(G.phase!=='fight'){a.l=a.r=a.b=false;return inp;}
  a.cool--;
  if(a.cool<=0){
    a.cool=Math.round(L.think*(.6+Math.random()*.8));a.l=a.r=a.b=false;
    const dx=o.x-f.x,dist=Math.abs(dx),to=dx>=0?'r':'l',away=dx>=0?'l':'r';
    const incoming=G.projs.find(p=>p.owner!==f&&Math.sign(f.x-p.x)===Math.sign(p.vx)&&Math.abs(f.x-p.x)<290);
    if(incoming&&Math.random()<L.react){if(Math.random()<.5&&f.onGround)inp.u=true;else a.b=true;a.cool=Math.min(a.cool,14);}
    else if(o.state==='attack'&&dist<150&&Math.random()<L.block){a.b=true;a.cool=Math.round(L.think*.7);}
    else if(dist>112){
      if(f.meter>=100&&Math.random()<L.spec&&dist>135)inp.s=true;
      else if(Math.random()<.4+L.aggr)a[to]=true;
      else if(Math.random()<.2)a[away]=true;
    }else{
      const r=Math.random();
      if(r<L.aggr){if(f.meter>=100&&Math.random()<L.spec*.6)inp.s=true;else if(Math.random()<.35+L.aggr*.3)inp.k=true;else inp.p=true;a.cool=Math.round(L.think*.6);}
      else if(r<L.aggr+.12)a[away]=true;
      else if(r<L.aggr+.2&&f.onGround)inp.u=true;
    }
  }
  inp.l=a.l;inp.r=a.r;inp.b=a.b&&f.state==='free';
  return inp;
};}

/* ---------------- fighter pose helper ---------------- */
function poseOf(f){
  const p={x:f.x,y:f.y,face:f.face,t:f.anim,ext:0,pose:'idle',lv:f.vx*f.face,aura:f.meter>=100&&f.state!=='ko'};
  if(f.state==='ko'){p.pose='ko';p.t=f.kot;}
  else if(f.state==='win')p.pose='cheer';
  else if(f.state==='hit')p.pose='hit';
  else if(f.state==='attack'){const a=f.act;
    if(a.n==='punch'){p.pose='punch';const q=a.t/PUNCH.dur;p.ext=q<.11?-.35*(q/.11):q<.3?lerp(-.35,1,(q-.11)/.19):Math.max(0,1-(q-.3)/.7);}
    else if(a.n==='kick'){p.pose='kick';const q=a.t/KICK.dur;p.ext=q<.14?-.3*(q/.14):q<.35?lerp(-.3,1,(q-.14)/.21):Math.max(0,1-(q-.35)/.65);}
    else{const s=a.sub;
      if(s==='spin'){p.pose='spin';p.rot=a.t*.75;}
      else if(s==='pounce'){p.pose=a.phase===0?'crouch':a.phase===1?'pounce':'crouch';}
      else{p.pose='cast';p.ext=clamp(a.t/14,0,1)*(a.t>26?.5:1);}}}

  else if(!f.onGround)p.pose='air';
  else if(f.blocking)p.pose='block';
  else if(Math.abs(f.vx)>.6)p.pose='walk';
  return p;
}

    g.save();g.translate(W/2,H-250);g.fillStyle='#ffd23f';g.strokeStyle=OUT;g.lineWidth=4;g.beginPath();g.moveTo(-46,0);g.lineTo(-30,-60);g.lineTo(-12,-24);g.lineTo(0,-72);g.lineTo(12,-24);g.lineTo(30,-60);g.lineTo(46,0);g.closePath();g.restore();
    txt('CHAMPION!',W/2,86,96,'#ffd23f','center','#3a2630',18);
    txt(R.p1.name+' beat all 8 guinea pigs and wins the Golden Carrot!',W/2,152,24,'#fff','center','#3a2630',6);
    button('Back to menu',W/2-140,452,280,58,()=>go('title'));
    for(const c of this.conf){c.y+=c.vy;c.r+=.08;if(c.y>H+20){c.y=-20;c.x=rnd(0,W);}g.save();g.translate(c.x,c.y);g.rotate(c.r);g.fillStyle=c.c;g.fillRect(-c.s/2,-c.s/4,c.s,c.s/2);g.restore();}
  }};

/* ---------------- main loop ---------------- */
let last=performance.now(),acc=0;
function loop(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){frameT++;if(scene&&scene.update)scene.update();acc-=1000/60;}
  g=lowG;g.setTransform(.5,0,0,.5,0,0);g.imageSmoothingEnabled=false;g.clearRect(0,0,W,H);
  if(scene)scene.draw();
  g=mainG;g.setTransform(1,0,0,1,0,0);g.imageSmoothingEnabled=false;g.drawImage(LOW,0,0,W,H);
  requestAnimationFrame(loop);
}
go('title');
requestAnimationFrame(loop);
window.__cavy={startMatch,ROSTER,BOSS,LV,go,get G(){return G;},get R(){return R;},get scene(){return scene.name;},set speed(v){}};
})();
</script>
