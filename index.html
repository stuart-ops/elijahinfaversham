<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELIJAH IN FAVERSHAM ☢ REACTOR ONLINE</title>
<meta name="description" content="Elijah's personal site — Faversham's most radioactive corner of the internet.">
<style>
  /* ============================================================
     ☢ ELIJAH IN FAVERSHAM — CHERNOBYL CONTROL ROOM THEME ☢
     Content lives in content.json — edit it at /admin.html
     Do not hand-edit the content in this file; it gets replaced
     on load by whatever content.json says.
     ============================================================ */
  :root {
    --rad-green: #39ff14;
    --rad-green-dim: #1a7a0a;
    --hazard-yellow: #ffd400;
    --warn-orange: #ff6b00;
    --alarm-red: #ff2222;
    --bg-black: #050805;
    --bg-panel: #0a120a;
    --crt-glow: rgba(57, 255, 20, 0.15);
    --font-mono: "Courier New", Courier, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg-black);
    color: var(--rad-green);
    font-family: var(--font-mono);
    overflow-x: hidden;
    cursor: crosshair;
  }

  ::selection { background: var(--hazard-yellow); color: #000; }

  /* ---- CRT scanlines over everything ---- */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.18) 0px,
      rgba(0,0,0,0.18) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: multiply;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9998;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  }

  /* ---- Radiation meter (fixed, scroll-driven) ---- */
  #rad-meter {
    position: fixed;
    top: 0; left: 0;
    height: 6px;
    width: 0%;
    z-index: 10000;
    background: linear-gradient(90deg, var(--rad-green), var(--hazard-yellow), var(--warn-orange), var(--alarm-red));
    box-shadow: 0 0 12px var(--rad-green);
    transition: width 0.1s linear;
  }
  #rad-readout {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 10000;
    background: rgba(5, 8, 5, 0.85);
    border: 1px solid var(--rad-green);
    padding: 6px 10px;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--rad-green);
    text-shadow: 0 0 6px var(--rad-green);
  }
  #rad-readout .cps { color: var(--hazard-yellow); }

  /* ---- Hazard tape marquee ---- */
  .hazard-tape {
    background: repeating-linear-gradient(
      45deg,
      var(--hazard-yellow) 0 20px,
      #111 20px 40px
    );
    color: #000;
    overflow: hidden;
    white-space: nowrap;
    border-top: 3px solid #000;
    border-bottom: 3px solid #000;
    user-select: none;
  }
  .hazard-tape .tape-inner {
    display: inline-block;
    padding: 8px 0;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 2px;
    background: var(--hazard-yellow);
    animation: tape-scroll 22s linear infinite;
  }
  @keyframes tape-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* ---- Hero ---- */
  header.hero {
    min-height: 92vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    padding: 40px 20px;
  }
  .trefoil {
    font-size: 72px;
    color: var(--hazard-yellow);
    text-shadow: 0 0 25px var(--hazard-yellow), 0 0 60px var(--warn-orange);
    animation: spin 14s linear infinite, pulse-glow 2.2s ease-in-out infinite alternate;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse-glow {
    from { text-shadow: 0 0 15px var(--hazard-yellow); }
    to   { text-shadow: 0 0 40px var(--hazard-yellow), 0 0 90px var(--warn-orange); }
  }

  h1.glitch {
    font-size: clamp(2.2rem, 9vw, 6rem);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--rad-green);
    position: relative;
    margin: 24px 0 8px;
    text-shadow: 0 0 12px var(--rad-green);
    animation: flicker 4s infinite;
  }
  h1.glitch::before,
  h1.glitch::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  h1.glitch::before {
    color: var(--alarm-red);
    animation: glitch-shift 3.1s infinite steps(2, jump-none);
    clip-path: inset(20% 0 55% 0);
    opacity: 0.8;
  }
  h1.glitch::after {
    color: #00e5ff;
    animation: glitch-shift 2.3s infinite reverse steps(2, jump-none);
    clip-path: inset(60% 0 15% 0);
    opacity: 0.8;
  }
  @keyframes glitch-shift {
    0%   { transform: translate(0); }
    20%  { transform: translate(-4px, 2px); }
    40%  { transform: translate(4px, -1px); }
    60%  { transform: translate(-2px, -2px); }
    80%  { transform: translate(3px, 2px); }
    100% { transform: translate(0); }
  }
  @keyframes flicker {
    0%, 91%, 94%, 100% { opacity: 1; }
    92%, 95% { opacity: 0.55; }
  }

  .hero .subtitle {
    color: var(--hazard-yellow);
    font-size: clamp(0.9rem, 2.5vw, 1.3rem);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .hero .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .hero .scroll-hint {
    position: absolute;
    bottom: 26px;
    font-size: 13px;
    color: var(--rad-green-dim);
    letter-spacing: 2px;
  }

  /* ---- Sound toggle ---- */
  #geiger-toggle {
    position: fixed;
    bottom: 14px; right: 14px;
    z-index: 10000;
    background: var(--bg-panel);
    color: var(--hazard-yellow);
    border: 1px solid var(--hazard-yellow);
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 1px;
    padding: 8px 12px;
    cursor: pointer;
  }
  #geiger-toggle:hover,
  #geiger-toggle:focus-visible {
    background: var(--hazard-yellow);
    color: #000;
    box-shadow: 0 0 18px var(--hazard-yellow);
  }

  /* ---- Sections ---- */
  main { max-width: 1050px; margin: 0 auto; padding: 0 20px; }

  section { padding: 80px 0; }

  h2.section-title {
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    text-transform: uppercase;
    letter-spacing: 4px;
    color: var(--hazard-yellow);
    text-shadow: 0 0 10px rgba(255, 212, 0, 0.6);
    border-bottom: 2px dashed var(--rad-green-dim);
    padding-bottom: 10px;
    margin-bottom: 34px;
  }
  h2.section-title::before { content: "☢ "; color: var(--rad-green); }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--rad-green-dim);
    box-shadow: inset 0 0 40px rgba(57, 255, 20, 0.05), 0 0 18px rgba(57, 255, 20, 0.08);
    padding: 26px;
  }

  /* ---- Control Room (about) ---- */
  .about-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 24px;
  }
  .about-text p { line-height: 1.75; margin-bottom: 14px; font-size: 15px; }
  .about-text .highlight { color: var(--hazard-yellow); }

  .stats { display: flex; flex-direction: column; gap: 14px; }
  .stat {
    border: 1px solid var(--rad-green-dim);
    padding: 12px 16px;
    background: rgba(57, 255, 20, 0.04);
  }
  .stat .num {
    font-size: 28px;
    color: var(--rad-green);
    text-shadow: 0 0 10px var(--rad-green);
  }
  .stat .label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--rad-green-dim);
  }

  /* ---- Experiments (hobbies) ---- */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--bg-panel);
    border: 1px solid var(--rad-green-dim);
    padding: 22px;
    position: relative;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .card:hover {
    transform: translateY(-6px) rotate(-0.5deg);
    border-color: var(--rad-green);
    box-shadow: 0 0 22px var(--crt-glow), 0 10px 30px rgba(0,0,0,0.6);
  }
  .card .card-icon { font-size: 34px; margin-bottom: 12px; display: block; }
  .card h3 {
    color: var(--hazard-yellow);
    font-size: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .card p { font-size: 13.5px; line-height: 1.6; color: #a8e6a0; }
  .card .danger-level {
    margin-top: 14px;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--warn-orange);
  }

  /* ---- Specimen Archive (gallery) ---- */
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px;
  }
  .specimen {
    border: 1px solid var(--rad-green-dim);
    background: var(--bg-panel);
    display: flex;
    flex-direction: column;
    transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    overflow: hidden;
  }
  .specimen:hover {
    border-color: var(--hazard-yellow);
    box-shadow: 0 0 20px rgba(255, 212, 0, 0.25);
    transform: translateY(-4px);
  }
  .specimen .spec-frame {
    aspect-ratio: 4 / 3;
    background:
      linear-gradient(135deg, rgba(57,255,20,0.08), rgba(255,212,0,0.05)),
      #060a06;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-bottom: 1px solid var(--rad-green-dim);
  }
  .specimen .spec-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .specimen figcaption {
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .specimen .spec-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--hazard-yellow);
  }
  .specimen .spec-note {
    font-size: 13px;
    line-height: 1.55;
    color: #a8e6a0;
  }
  .gallery-empty {
    border: 1px dashed var(--rad-green-dim);
    padding: 40px 24px;
    text-align: center;
    color: var(--rad-green-dim);
    font-size: 13px;
    letter-spacing: 2px;
    grid-column: 1 / -1;
  }

  /* ---- Transmit (contact) ---- */
  .transmit-panel { text-align: center; }
  .transmit-panel p { line-height: 1.7; margin-bottom: 20px; font-size: 15px; }
  .contact-btn {
    display: inline-block;
    background: var(--rad-green);
    color: #000;
    font-family: var(--font-mono);
    font-weight: bold;
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    padding: 14px 30px;
    border: none;
    box-shadow: 0 0 20px var(--rad-green);
    transition: all 0.15s ease;
  }
  .contact-btn:hover,
  .contact-btn:focus-visible {
    background: var(--hazard-yellow);
    box-shadow: 0 0 30px var(--hazard-yellow);
    transform: scale(1.04);
  }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    padding: 40px 20px 60px;
    font-size: 12px;
    color: var(--rad-green-dim);
    letter-spacing: 1px;
  }
  footer .warn { color: var(--warn-orange); }

  /* ---- Particles canvas ---- */
  #particles {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .hero, main, footer { position: relative; z-index: 2; }

  :focus-visible { outline: 2px solid var(--hazard-yellow); outline-offset: 3px; }

  /* ---- Reduced motion: calm everything down ---- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    html { scroll-behavior: auto; }
    #particles { display: none; }
    h1.glitch::before, h1.glitch::after { display: none; }
  }

  @media (max-width: 720px) {
    .about-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="rad-meter"></div>
<div id="rad-readout">RAD LEVEL: <span class="cps" id="cps">0012</span> CPS</div>
<canvas id="particles"></canvas>

<!-- ======================= HERO ======================= -->
<header class="hero">
  <span class="trefoil">☢</span>
  <h1 class="glitch" id="hero-title" data-text="ELIJAH IN FAVERSHAM">ELIJAH IN FAVERSHAM</h1>
  <p class="subtitle">REACTOR STATUS: <span style="color:var(--rad-green)" id="hero-status">ONLINE</span> <span class="blink">▓</span></p>
  <p class="scroll-hint">▼ SCROLL TO INCREASE EXPOSURE ▼</p>
</header>

<!-- ======================= HAZARD TAPE ======================= -->
<div class="hazard-tape" aria-hidden="true">
  <div class="tape-inner" id="tape-inner"></div>
</div>

<main>

  <!-- ======================= CONTROL ROOM (ABOUT) ======================= -->
  <section id="control-room">
    <h2 class="section-title" id="about-heading">Control Room</h2>
    <div class="panel about-grid">
      <div class="about-text" id="about-text"></div>
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <!-- ======================= EXPERIMENTS (HOBBIES) ======================= -->
  <section id="experiments">
    <h2 class="section-title">Experiments</h2>
    <div class="card-grid" id="hobby-grid"></div>
  </section>

  <!-- ======================= SPECIMEN ARCHIVE (GALLERY) ======================= -->
  <section id="specimen-archive">
    <h2 class="section-title" id="gallery-heading">Specimen Archive</h2>
    <div class="gallery-grid" id="gallery-grid"></div>
  </section>

  <!-- ======================= TRANSMIT (CONTACT) ======================= -->
  <section id="transmit">
    <h2 class="section-title" id="contact-heading">Transmit</h2>
    <div class="panel transmit-panel" id="transmit-panel"></div>
  </section>

</main>

<!-- ======================= FOOTER ======================= -->
<footer>
  <p id="footer-line">☢ ELIJAHINFAVERSHAM.COM — BROADCASTING FROM THE FAVERSHAM EXCLUSION ZONE ☢</p>
  <p class="warn" id="footer-warning">NO ACTUAL RADIATION WAS HARMED IN THE MAKING OF THIS WEBSITE</p>
</footer>

<button id="geiger-toggle" aria-pressed="false">🔊 GEIGER: OFF</button>

<script>
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Declared up here on purpose: updateMeter() and startCounters() both run
  // before the sections below are reached, and `let` would trap them.
  let geigerRate = 0.5;
  let io = null;

  // ============================================================
  // Render the page from content.json
  // ============================================================
  const $ = (id) => document.getElementById(id);

  function dangerBar(level) {
    const n = Math.max(0, Math.min(5, Number(level) || 0));
    const words = ["MINIMAL", "LOW", "MODERATE", "HIGH", "SEVERE", "CRITICAL"];
    return "DANGER LEVEL: " + "█".repeat(n) + "░".repeat(5 - n) + " " + words[n];
  }

  function pad3(n) { return String(n).padStart(3, "0"); }

  function render(c) {
    // --- site chrome ---
    if (c.site) {
      if (c.site.pageTitle) document.title = c.site.pageTitle;
      if (c.site.pageDescription) {
        const m = document.querySelector('meta[name="description"]');
        if (m) m.setAttribute("content", c.site.pageDescription);
      }
      if (c.site.heroTitle) {
        const h = $("hero-title");
        h.textContent = c.site.heroTitle;
        h.setAttribute("data-text", c.site.heroTitle);
      }
      if (c.site.heroStatus) $("hero-status").textContent = c.site.heroStatus;
      if (c.site.tapeText) {
        const t = "⚠ " + c.site.tapeText + " — ☢ — ";
        $("tape-inner").textContent = t + t;
      }
      if (c.site.footerLine) $("footer-line").textContent = "☢ " + c.site.footerLine + " ☢";
      if (c.site.footerWarning) $("footer-warning").textContent = c.site.footerWarning;
    }

    // --- about ---
    if (c.about) {
      if (c.about.heading) $("about-heading").textContent = c.about.heading;
      const box = $("about-text");
      box.innerHTML = "";
      const open = document.createElement("p");
      open.textContent = "> INITIALIZING PERSONNEL FILE...";
      box.appendChild(open);
      (c.about.paragraphs || []).forEach((text) => {
        const p = document.createElement("p");
        p.textContent = text;
        box.appendChild(p);
      });
      const close = document.createElement("p");
      close.innerHTML = '&gt; FILE STATUS: <span style="color:var(--alarm-red)">CLASSIFIED</span>';
      box.appendChild(close);
    }

    // --- stats ---
    const statBox = $("stats");
    statBox.innerHTML = "";
    (c.stats || []).forEach((s) => {
      const wrap = document.createElement("div");
      wrap.className = "stat";
      const num = document.createElement("div");
      num.className = "num";
      num.dataset.count = String(s.number ?? 0);
      num.textContent = "0";
      const lab = document.createElement("div");
      lab.className = "label";
      lab.textContent = s.label || "";
      wrap.append(num, lab);
      statBox.appendChild(wrap);
    });

    // --- hobbies ---
    const grid = $("hobby-grid");
    grid.innerHTML = "";
    (c.hobbies || []).forEach((h) => {
      const card = document.createElement("div");
      card.className = "card";
      const icon = document.createElement("span");
      icon.className = "card-icon";
      icon.textContent = h.icon || "☢";
      const title = document.createElement("h3");
      title.textContent = h.title || "";
      const body = document.createElement("p");
      body.textContent = h.text || "";
      const danger = document.createElement("div");
      danger.className = "danger-level";
      danger.textContent = dangerBar(h.danger);
      card.append(icon, title, body, danger);
      grid.appendChild(card);
    });

    // --- gallery ---
    if (c.gallery && c.gallery.heading) $("gallery-heading").textContent = c.gallery.heading;
    const gal = $("gallery-grid");
    gal.innerHTML = "";
    const items = (c.gallery && c.gallery.items) || [];
    if (!items.length) {
      const empty = document.createElement("div");
      empty.className = "gallery-empty";
      empty.textContent = "ARCHIVE EMPTY — NO SPECIMENS LOGGED YET";
      gal.appendChild(empty);
    } else {
      items.forEach((item, i) => {
        const fig = document.createElement("figure");
        fig.className = "specimen";
        const frame = document.createElement("div");
        frame.className = "spec-frame";
        const img = document.createElement("img");
        img.src = item.file || "";
        img.alt = item.label || ("Specimen " + pad3(i + 1));
        img.loading = "lazy";
        frame.appendChild(img);
        const cap = document.createElement("figcaption");
        const lab = document.createElement("span");
        lab.className = "spec-label";
        lab.textContent = "SPECIMEN " + pad3(i + 1) + (item.label ? " — " + item.label : "");
        cap.appendChild(lab);
        if (item.caption) {
          const note = document.createElement("span");
          note.className = "spec-note";
          note.textContent = item.caption;
          cap.appendChild(note);
        }
        fig.append(frame, cap);
        gal.appendChild(fig);
      });
    }

    // --- contact ---
    if (c.contact) {
      if (c.contact.heading) $("contact-heading").textContent = c.contact.heading;
      const panel = $("transmit-panel");
      panel.innerHTML = "";
      const open = document.createElement("p");
      open.textContent = "> OPENING COMMUNICATION CHANNEL...";
      panel.appendChild(open);
      const intro = document.createElement("p");
      intro.textContent = c.contact.intro || "";
      panel.appendChild(intro);
      if (c.contact.enabled !== false && c.contact.email) {
        const a = document.createElement("a");
        a.className = "contact-btn";
        a.href = "mailto:" + c.contact.email;
        a.textContent = "☢ " + (c.contact.buttonLabel || "Send Transmission");
        panel.appendChild(a);
      }
      const section = document.getElementById("transmit");
      section.style.display = (c.contact.enabled === false) ? "none" : "";
    }

    startCounters();
  }

  fetch("content.json?v=" + Date.now())
    .then((r) => { if (!r.ok) throw new Error("content.json " + r.status); return r.json(); })
    .then(render)
    .catch((err) => {
      console.error("Could not load content.json:", err);
      const box = $("about-text");
      if (box && !box.children.length) {
        box.innerHTML = "<p>&gt; CONTENT FILE UNREADABLE — CHECK content.json</p>";
      }
    });

  // ============================================================
  // Scroll-driven radiation meter + readout
  // ============================================================
  const meter = $("rad-meter");
  const cpsEl = $("cps");
  function updateMeter() {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const pct = max > 0 ? (window.scrollY / max) : 0;
    meter.style.width = (pct * 100).toFixed(1) + "%";
    const cps = Math.round(12 + pct * 9975);
    cpsEl.textContent = String(cps).padStart(4, "0");
    geigerRate = 0.5 + pct * 14;
  }
  window.addEventListener("scroll", updateMeter, { passive: true });
  updateMeter();

  // ============================================================
  // Geiger counter sounds (WebAudio, no files needed)
  // ============================================================
  let audioCtx = null;
  let geigerOn = false;
  const toggleBtn = $("geiger-toggle");

  function geigerClick() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.value = 900 + Math.random() * 2200;
    gain.gain.setValueAtTime(0.12, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.035);
  }

  function geigerLoop() {
    if (!geigerOn) return;
    geigerClick();
    const delay = -Math.log(1 - Math.random()) / geigerRate * 1000;
    setTimeout(geigerLoop, Math.min(Math.max(delay, 30), 3000));
  }

  toggleBtn.addEventListener("click", () => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    geigerOn = !geigerOn;
    toggleBtn.textContent = geigerOn ? "🔊 GEIGER: ON" : "🔊 GEIGER: OFF";
    toggleBtn.setAttribute("aria-pressed", String(geigerOn));
    if (geigerOn) geigerLoop();
  });

  // ============================================================
  // Stat counters (count up when scrolled into view)
  // ============================================================
  const seen = new WeakSet();
  function startCounters() {
    if (io) io.disconnect();
    io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting || seen.has(e.target)) return;
        seen.add(e.target);
        const target = parseInt(e.target.dataset.count, 10) || 0;
        if (reducedMotion) { e.target.textContent = target; return; }
        const start = performance.now();
        const dur = 1400;
        function tick(now) {
          const p = Math.min((now - start) / dur, 1);
          e.target.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
          if (p < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      });
    }, { threshold: 0.4 });
    document.querySelectorAll(".stat .num").forEach((n) => io.observe(n));
  }

  // ============================================================
  // Floating radioactive particle field
  // ============================================================
  const canvas = $("particles");
  if (!reducedMotion && canvas) {
    const ctx = canvas.getContext("2d");
    let w, h, parts;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();
    const COLORS = ["#39ff14", "#ffd400", "#ff6b00"];
    parts = Array.from({ length: 45 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: 1 + Math.random() * 2.5,
      vx: (Math.random() - 0.5) * 0.35,
      vy: -0.15 - Math.random() * 0.45,
      c: COLORS[Math.floor(Math.random() * COLORS.length)],
      a: 0.2 + Math.random() * 0.5,
    }));
    (function animate() {
      ctx.clearRect(0, 0, w, h);
      for (const p of parts) {
        p.x += p.vx; p.y += p.vy;
        if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;
        ctx.globalAlpha = p.a;
        ctx.fillStyle = p.c;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.c;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(animate);
    })();
  }
</script>
</body>
</html>
