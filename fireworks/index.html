<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Private screening</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050805;color:#7CFC00;font-family:ui-monospace,Menlo,Consolas,monospace;text-align:center}
  main{width:min(92vw,520px);padding:24px}
  h1{font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase}
  input,button{font:inherit;padding:12px;margin:6px 0;width:100%;box-sizing:border-box;border:1px solid #7CFC00;background:#0b130b;color:#7CFC00}
  button{cursor:pointer;background:#7CFC00;color:#050805;font-weight:bold}
  #msg{min-height:1.4em;color:#ffb000}
  video{width:100%;max-height:80vh;background:#000;margin-top:12px}
</style>
</head>
<body>
<main id="gate">
  <h1>&#9762; Private screening</h1>
  <p>Enter the passphrase to watch.</p>
  <input id="pw" type="password" placeholder="passphrase" autocomplete="current-password" spellcheck="false" autocapitalize="none">
  <button id="go">Unlock</button>
  <div id="msg"></div>
</main>
<script>
const $ = id => document.getElementById(id);
async function unlock(){
  const msg = $("msg"); msg.textContent = "Unlocking... (a few seconds)";
  try{
    const phrase = $("pw").value.trim().toLowerCase().replace(/\s+/g," ");
    const res = await fetch("video.enc?v=2"); if(!res.ok) throw new Error("fetch");
    const buf = new Uint8Array(await res.arrayBuffer());
    const salt = buf.slice(0,16), iv = buf.slice(16,28), ct = buf.slice(28);
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(phrase), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:600000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
    const url = URL.createObjectURL(new Blob([plain], {type:"video/mp4"}));
    $("gate").innerHTML = '<h1>&#9762; Fireworks</h1><video controls playsinline autoplay src="'+url+'"></video>';
  }catch(e){ msg.textContent = "Wrong passphrase, or the file could not be loaded."; }
}
$("go").addEventListener("click", unlock);
$("pw").addEventListener("keydown", e => { if(e.key==="Enter") unlock(); });
</script>
</body>
</html>
